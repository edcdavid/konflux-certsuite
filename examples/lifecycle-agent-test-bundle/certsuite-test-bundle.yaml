# Certsuite test bundle for openshift-kni/lifecycle-agent.
# https://github.com/openshift-kni/lifecycle-agent
apiVersion: certsuite.redhat.com/v1alpha1
kind: TestBundle
metadata:
  name: lifecycle-agent-test-bundle
  labels:
    app.kubernetes.io/part-of: lifecycle-agent
spec:
  # CSV suggested-namespace
  namespace: openshift-lifecycle-agent

  # CSV supports OwnNamespace and AllNamespaces; OwnNamespace matches suggested ns.
  installMode: OwnNamespace

  description: |
    Software-only test deployment of the Lifecycle Agent operator for certsuite.
    Installs the controller in openshift-lifecycle-agent and applies an
    ImageBasedUpgrade CR left in Idle stage so the operator reconciles without
    performing seed generation or an image-based upgrade (no real seed image,
    OADP, or SNO hardware required).

  discoveryLabels:
    operator: "redhat-best-practices-for-k8s.com/operator=target"
    pod: "redhat-best-practices-for-k8s.com/generic=target"
    resources:
      - kind: Deployment

  readiness:
    timeout: 300
    checks:
      - kind: Deployment
        name: lifecycle-agent-controller-manager
      - kind: ImageBasedUpgrade
        name: upgrade
