# Certsuite Test Bundle Manifest
#
# This file describes how to deploy a software-only test version of an
# operator's operands. The manifests in operands/ should deploy everything
# needed to exercise the operator without requiring specialized hardware,
# license keys, or external services.
#
# The test bundle also includes certsuite_config.yml which tells certsuite
# where to find the operator's workloads (namespaces, labels, CRD filters).
apiVersion: certsuite.redhat.com/v1alpha1
kind: TestBundle
metadata:
  name: example-operator-test-bundle
  labels:
    app.kubernetes.io/part-of: example-operator
spec:
  # Namespace for operator install AND operand deployment.
  # Leave empty to fall back to CSV suggested-namespace, then auto-generate.
  namespace: ""

  # OLM install mode that determines the OperatorGroup configuration.
  # One of: AllNamespaces, OwnNamespace, SingleNamespace, MultiNamespace.
  # Leave empty to auto-detect from CSV supported modes
  # (prefers AllNamespaces, then OwnNamespace).
  installMode: ""

  # Human-readable description
  description: |
    Deploys a minimal set of example-operator operands for certsuite
    testing. Uses software-only configuration with no hardware or
    license dependencies.

  # Certsuite discovery labels applied after operator install so certsuite
  # can find the operator CSV and its workload pods.
  # Omit to use defaults: CSV gets "operator=target", all DaemonSets get
  # "generic=target" on their pod templates.
  discoveryLabels:
    operator: "redhat-best-practices-for-k8s.com/operator=target"
    pod: "redhat-best-practices-for-k8s.com/generic=target"
    resources:
      - kind: Deployment

  # Readiness checks -- the pipeline waits for these before running certsuite
  readiness:
    timeout: 300
    checks:
      - kind: Deployment
        name: example-controller
      - kind: Deployment
        name: example-agent
