apiVersion: certsuite.redhat.com/v1alpha1
kind: TestBundle
metadata:
  name: ptp-operator-test-bundle
  labels:
    app.kubernetes.io/part-of: ptp-operator
spec:
  namespace: openshift-ptp

  # PTP supports OwnNamespace and SingleNamespace; use OwnNamespace for test.
  installMode: OwnNamespace

  description: |
    Software-only test deployment of ptp-operator operands. Creates a
    PtpConfig CR that exercises the operator's reconciliation logic
    without requiring PTP-capable NICs. The linuxptp-daemon DaemonSet
    will be scheduled on worker nodes and the operator will process the
    configuration, which is sufficient to verify the operator is
    properly deployed and functioning.

  # PTP workloads are DaemonSets, not Deployments.
  discoveryLabels:
    operator: "redhat-best-practices-for-k8s.com/operator=target"
    pod: "redhat-best-practices-for-k8s.com/generic=target"
    resources:
      - kind: DaemonSet

  # Optional CSV patches applied after OLM creates the CSV and before
  # waiting for Succeeded. These are required for HyperShift EaaS guests
  # (often older kube than the 4.22 bundle's minKubeVersion; no master nodes).
  csvPatches:
    - path: csv-patches/00-remove-min-kube-version.json
    - path: csv-patches/01-remove-master-nodeselector.json

  readiness:
    timeout: 300
    checks:
      # Rollout readiness (waits for pods to be Running)
      - kind: DaemonSet
        name: linuxptp-daemon
      # Presence checks (verifies the resource exists)
      - kind: PtpConfig
        name: test-software-only
      - kind: PtpOperatorConfig
        name: default
