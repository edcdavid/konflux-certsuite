apiVersion: tekton.dev/v1
kind: Pipeline
metadata:
  name: certsuite-operator-test-eaas
  labels:
    app.kubernetes.io/part-of: konflux-certsuite
    upstream-usable: "true"
spec:
  description: |
    Provisions an ephemeral EaaS Hypershift cluster, deploys an operator from
    an FBC fragment, deploys operands from a test bundle, and runs certsuite.
    The cluster is automatically destroyed when the PipelineRun completes.

    This is the recommended variant for most operators. Use the shared-cluster
    variant (certsuite-operator-test.yaml) only when you need a persistent
    cluster with specific hardware or configuration.
  params:
    - name: SNAPSHOT
      type: string
      description: Konflux ApplicationSnapshot JSON
    - name: TEST_BUNDLE_REF
      type: string
      description: |
        Git URL pointing to the operator's certsuite test bundle.
        Format: URL[.git@revision][#path]
        Examples:
          https://github.com/org/repo.git@main#tests/my-bundle
          https://github.com/org/repo#tests/my-bundle
          https://github.com/org/repo.git@fix/my-branch#tests/my-bundle
    - name: CERTSUITE_LABELS
      type: string
      default: "common"
      description: |
        Comma-separated certsuite test labels (e.g. "networking,lifecycle").
    - name: PACKAGE_NAME
      type: string
      default: ""
    - name: CHANNEL_NAME
      type: string
      default: ""
    - name: IMAGES_MIRROR_SET_REF
      type: string
      default: ""
      description: |
        Optional override for the operator's ImageDigestMirrorSet used to build
        Hypershift imageContentSources (managed IDMS on the guest cluster).

        Format: URL[.git@revision][#path]
        Example:
          https://github.com/org/repo.git@release-4.22#.tekton/images-mirror-set.yaml

        When empty (recommended), the pipeline uses the same git repo/revision as
        TEST_BUNDLE_REF with path .tekton/images-mirror-set.yaml — the Konflux
        / Conforma convention most operator monorepos already maintain.

        Leave unset for released operators that pull from registry.redhat.io
        (or when the FBC is not on quay.io/redhat-user-workloads).
    - name: PIPELINE_SCRIPTS_REF
      type: string
      default: "https://github.com/redhat-best-practices-for-k8s/konflux-certsuite.git@main"
      description: |
        Git URL for fetching pipeline helper scripts (resolve-bundle-config.sh,
        wait-for-readiness.sh). Defaults to upstream main. Override to test
        from a fork/branch.
        Format: URL[.git@revision]
    - name: OCI_PUSH_SECRET
      type: string
      default: "oci-push-secret-not-configured"
      description: |
        kubernetes.io/dockerconfigjson Secret with push access to the Quay repo
        where certsuite results are stored. Use the component's ImageRepository
        push secret (oc get imagerepository -o jsonpath='{.status.credentials.push-secret}').
        Results are tagged on the same image URL as the FBC/component under test.
    - name: OCI_RESULTS_REPO
      type: string
      default: ""
      description: |
        External OCI registry reference for storing certsuite results
        (e.g. quay.io/my-org/certsuite-results). When set, results are
        pushed here instead of the component's FBC image repo.
        Must not contain a tag (:) or digest (@).
        Requires OCI_RESULTS_SECRET for authentication.
    - name: OCI_RESULTS_SECRET
      type: string
      default: "oci-results-secret-not-configured"
      description: |
        kubernetes.io/dockerconfigjson Secret with push access to the
        external OCI_RESULTS_REPO. Required when OCI_RESULTS_REPO is set.
        Unlike OCI_PUSH_SECRET this secret is never sent to the component
        registry and vice-versa.
    - name: REGISTRY_PULL_SECRET
      type: string
      default: "registry-pull-secret-not-configured"
      description: |
        Optional kubernetes.io/dockerconfigjson Secret in the tenant namespace
        used by get-unreleased-bundle to authenticate to registries such as
        registry.redhat.io (for example telco-5g-redhat-pull-secret).

        When set to an existing Secret, that dockerconfig is preferred for
        bundle discovery. When unset / placeholder / missing, the task falls
        back to docker config from secrets linked on the PipelineRun
        ServiceAccount (konflux-integration-runner), matching prior behavior.

        Prefer this param over namespace-wide SA linking when only certsuite
        needs the registry.redhat.io credentials.

  tasks:
    # ── 1. Parse Snapshot Metadata ──────────────────────────────────────
    - name: parse-metadata
      taskRef:
        resolver: git
        params:
          - name: url
            value: https://github.com/konflux-ci/integration-examples
          - name: revision
            value: main
          - name: pathInRepo
            value: tasks/test_metadata.yaml
      params:
        - name: SNAPSHOT
          value: $(params.SNAPSHOT)

    # ── 2. Provision EaaS Space ────────────────────────────────────────
    - name: provision-eaas-space
      runAfter:
        - parse-metadata
      taskRef:
        resolver: git
        params:
          - name: url
            value: https://github.com/konflux-ci/build-definitions.git
          - name: revision
            value: main
          - name: pathInRepo
            value: task/eaas-provision-space/0.1/eaas-provision-space.yaml
      params:
        - name: ownerName
          value: $(context.pipelineRun.name)
        - name: ownerUid
          value: $(context.pipelineRun.uid)

    # ── 3. Get Unreleased Bundle from FBC ──────────────────────────────
    - name: get-unreleased-bundle
      runAfter:
        - provision-eaas-space
      params:
        - name: registryPullSecret
          value: $(params.REGISTRY_PULL_SECRET)
      taskSpec:
        params:
          - name: registryPullSecret
            type: string
        results:
          # get-bundle is inlined (not a StepAction ref) so DOCKER_CONFIG / volumeMounts
          # are allowed — Tekton rejects env/volumeMounts together with step ref.
          - name: unreleasedBundle
            value: "$(steps.get-bundle.results.unreleasedBundle)"
          - name: quayBundle
            description: Pullable quay.io bundle image (same digest as catalog ref)
          - name: packageName
            value: "$(steps.get-bundle.results.packageName)"
          - name: channelName
            value: "$(steps.get-bundle.results.channelName)"
        volumes:
          - name: registry-pull-creds
            secret:
              secretName: $(params.registryPullSecret)
              optional: true
          - name: docker-config
            emptyDir: {}
        steps:
          # Prefer REGISTRY_PULL_SECRET when present; otherwise keep SA-linked auth.
          - name: prepare-registry-auth
            image: quay.io/konflux-ci/konflux-test:v1.4.31@sha256:a7cae9e96663e277a3904d0c78630508ddb6cc8eebaa912a840bd20f68dcaad1
            volumeMounts:
              - name: registry-pull-creds
                mountPath: /registry-pull-creds
                readOnly: true
              - name: docker-config
                mountPath: /workspace/docker-config
            script: |
              #!/usr/bin/env bash
              set -euo pipefail
              DEST="/workspace/docker-config/config.json"
              if [[ -s /registry-pull-creds/.dockerconfigjson ]]; then
                cp /registry-pull-creds/.dockerconfigjson "${DEST}"
                echo "Using REGISTRY_PULL_SECRET dockerconfig for registry auth"
              elif [[ -s /registry-pull-creds/config.json ]]; then
                cp /registry-pull-creds/config.json "${DEST}"
                echo "Using REGISTRY_PULL_SECRET config.json for registry auth"
              elif [[ -s /tekton/home/.docker/config.json ]]; then
                cp /tekton/home/.docker/config.json "${DEST}"
                echo "Using ServiceAccount-linked docker config for registry auth"
              elif [[ -s "${HOME}/.docker/config.json" ]]; then
                cp "${HOME}/.docker/config.json" "${DEST}"
                echo "Using HOME docker config for registry auth"
              else
                echo '{"auths":{}}' > "${DEST}"
                echo "WARNING: no registry pull credentials found; registry.redhat.io pulls may fail"
              fi

          # Inlined from tekton-integration-catalog get-unreleased-bundle StepAction so
          # we can set DOCKER_CONFIG (forbidden on steps that use ref).
          - name: get-bundle
            image: quay.io/konflux-ci/konflux-test:v1.4.48@sha256:9b815268fb2bf10b5d745518da1c6568944f15816efe51adc192972b42a6e74d
            computeResources:
              limits:
                memory: 8Gi
              requests:
                memory: 8Gi
                cpu: "1"
            results:
              - name: unreleasedBundle
                type: string
              - name: packageName
                type: string
              - name: channelName
                type: string
            env:
              - name: DOCKER_CONFIG
                value: /workspace/docker-config
              - name: FBC_FRAGMENT
                value: "$(tasks.parse-metadata.results.component-container-image)"
              - name: PACKAGE_NAME
                value: $(params.PACKAGE_NAME)
              - name: CHANNEL_NAME
                value: $(params.CHANNEL_NAME)
            volumeMounts:
              - name: docker-config
                mountPath: /workspace/docker-config
                readOnly: true
            script: |
              #!/usr/bin/env bash
              set -euo pipefail
              . /utils.sh

              if [[ -z "${FBC_FRAGMENT}" ]]; then
                echo "Error: FBC_FRAGMENT parameter is required." >&2
                exit 1
              fi

              echo "Retrieving unreleased bundles..."
              if ! unreleased_bundles=$(get_unreleased_bundles -i "$FBC_FRAGMENT"); then
                echo "Could not get unreleased bundle images from the fragment. Make sure you have ImagePullCredentials for registry.redhat.io (set REGISTRY_PULL_SECRET or link a pull secret to konflux-integration-runner)" >&2
                exit 1
              fi

              if [[ -z "${unreleased_bundles}" ]]; then
                echo "No unreleased bundles found. Exiting as a no-op."
                echo -n "" > "$(results.unreleasedBundle.path)"
                echo -n "" > "$(results.packageName.path)"
                echo -n "" > "$(results.channelName.path)"
                exit 0
              fi
              echo "Unreleased bundles found: $unreleased_bundles"

              if ! RENDER_OUT_FBC=$(render_opm -t "$FBC_FRAGMENT"); then
                echo "Failed to render the FBC fragment" >&2
                exit 1
              fi

              if [[ -z "$PACKAGE_NAME" ]]; then
                echo "Checking package association of unreleased bundles..."
                package_image_map=$(group_bundle_images_by_package "$RENDER_OUT_FBC" "$unreleased_bundles")
                echo "Package-image map: $package_image_map"
                package_count=$(echo "$package_image_map" | jq 'keys | length')

                if [[ "$package_count" -gt 1 ]]; then
                  echo "Error: Multiple packages detected. User must specify PACKAGE_NAME." >&2
                  exit 1
                fi

                PACKAGE_NAME=$(echo "$package_image_map" | jq -r 'keys[0]')
              fi
              echo "Using package: $PACKAGE_NAME"

              if [[ -z "$CHANNEL_NAME" ]]; then
                CHANNEL_NAME=$(get_channel_from_catalog "$RENDER_OUT_FBC" "$PACKAGE_NAME")
                if [[ -z "$CHANNEL_NAME" ]]; then
                  echo "Failed to determine a default channel for package '$PACKAGE_NAME'" >&2
                  exit 1
                fi
              fi
              echo "Using channel: $CHANNEL_NAME"

              if ! highest_version_from_bundles_list=$(get_highest_version_from_bundles_list "$RENDER_OUT_FBC" "$PACKAGE_NAME" "$CHANNEL_NAME" "$unreleased_bundles"); then
                echo "No unreleased bundle(s) found matching the specified package and/or channel. Exiting as a no-op."
                echo -n "" > "$(results.unreleasedBundle.path)"
                echo -n "" > "$(results.packageName.path)"
                echo -n "" > "$(results.channelName.path)"
                exit 0
              fi

              echo "Highest bundle: $highest_version_from_bundles_list"
              echo -n -e "$highest_version_from_bundles_list" > "$(results.unreleasedBundle.path)"
              echo -n "$PACKAGE_NAME" > "$(results.packageName.path)"
              echo -n "$CHANNEL_NAME" > "$(results.channelName.path)"

          # Catalog refs point at registry.redhat.io (401 for unreleased images).
          # Resolve the same digest on quay.io before any step tries opm render.
          - name: resolve-quay-bundle
            image: quay.io/konflux-ci/konflux-test:v1.4.31@sha256:a7cae9e96663e277a3904d0c78630508ddb6cc8eebaa912a840bd20f68dcaad1
            env:
              - name: DOCKER_CONFIG
                value: /workspace/docker-config
              - name: FBC_FRAGMENT
                value: "$(tasks.parse-metadata.results.component-container-image)"
              - name: BUNDLE_IMAGE
                value: "$(steps.get-bundle.results.unreleasedBundle)"
            volumeMounts:
              - name: docker-config
                mountPath: /workspace/docker-config
                readOnly: true
            script: |
              #!/usr/bin/env bash
              set -euo pipefail

              # Task-level result path (Tekton substitutes before bash runs).
              RESULT_PATH=$(results.quayBundle.path)

              if [[ -z "${BUNDLE_IMAGE}" ]]; then
                echo -n "" > "${RESULT_PATH}"
                exit 0
              fi

              # Already a quay ref — pass through
              if [[ "${BUNDLE_IMAGE}" == quay.io/* ]]; then
                echo "Bundle already on quay: ${BUNDLE_IMAGE}"
                echo -n "${BUNDLE_IMAGE}" > "${RESULT_PATH}"
                exit 0
              fi

              if [[ "${FBC_FRAGMENT}" != quay.io/redhat-user-workloads/* ]]; then
                echo "FBC not on redhat-user-workloads; keeping catalog ref"
                echo -n "${BUNDLE_IMAGE}" > "${RESULT_PATH}"
                exit 0
              fi

              FBC_BASE="${FBC_FRAGMENT%%@*}"
              TENANT_AND_REPO="${FBC_BASE#quay.io/redhat-user-workloads/}"
              TENANT="${TENANT_AND_REPO%%/*}"
              FBC_REPO="${TENANT_AND_REPO#*/}"
              BUNDLE_DIGEST="${BUNDLE_IMAGE##*@}"

              BUNDLE_REPO="${FBC_REPO/-fbc-/-bundle-mono-}"
              QUAY_BUNDLE="quay.io/redhat-user-workloads/${TENANT}/${BUNDLE_REPO}@${BUNDLE_DIGEST}"
              echo "Trying ${QUAY_BUNDLE}"
              if ! skopeo inspect --raw "docker://${QUAY_BUNDLE}" &>/dev/null; then
                BUNDLE_REPO="${FBC_REPO/-fbc-/-bundle-}"
                QUAY_BUNDLE="quay.io/redhat-user-workloads/${TENANT}/${BUNDLE_REPO}@${BUNDLE_DIGEST}"
                echo "Trying fallback ${QUAY_BUNDLE}"
                if ! skopeo inspect --raw "docker://${QUAY_BUNDLE}" &>/dev/null; then
                  echo "ERROR: Cannot resolve quay bundle for digest ${BUNDLE_DIGEST}" >&2
                  exit 1
                fi
              fi

              echo "Resolved quay bundle: ${QUAY_BUNDLE}"
              echo -n "${QUAY_BUNDLE}" > "${RESULT_PATH}"

    # ── 4. Pick Cluster Params ─────────────────────────────────────────
    - name: pick-cluster-params
      runAfter:
        - get-unreleased-bundle
      when:
        - input: "$(tasks.get-unreleased-bundle.results.unreleasedBundle)"
          operator: notin
          values: [""]
      taskSpec:
        results:
          - name: ocpVersion
            value: "$(steps.pick-cluster-version.results.ocpVersion)"
          - name: bundleArch
            value: "$(steps.pick-cluster-arch.results.bundleArch)"
        steps:
          - name: get-supported-versions
            ref:
              resolver: git
              params:
                - name: url
                  value: https://github.com/konflux-ci/build-definitions.git
                - name: revision
                  value: main
                - name: pathInRepo
                  value: stepactions/eaas-get-supported-ephemeral-cluster-versions/0.1/eaas-get-supported-ephemeral-cluster-versions.yaml
            params:
              - name: eaasSpaceSecretRef
                value: "$(tasks.provision-eaas-space.results.secretRef)"
          - name: pick-cluster-version
            ref:
              resolver: git
              params:
                - name: url
                  value: https://github.com/konflux-ci/tekton-integration-catalog.git
                - name: revision
                  value: main
                - name: pathInRepo
                  value: stepactions/bundles/pick-cluster-version/0.1/pick-cluster-version.yaml
            params:
              - name: fbcFragment
                value: "$(tasks.parse-metadata.results.component-container-image)"
              - name: clusterVersions
                value: ["$(steps.get-supported-versions.results.versions[*])"]
          - name: pick-cluster-arch
            ref:
              resolver: git
              params:
                - name: url
                  value: https://github.com/konflux-ci/tekton-integration-catalog.git
                - name: revision
                  value: main
                - name: pathInRepo
                  value: stepactions/bundles/pick-cluster-arch/0.1/pick-cluster-arch.yaml
            params:
              # Must be a pullable operator bundle (quay.io for unreleased).
              # Catalog refs on registry.redhat.io return 401 for pre-release digests.
              - name: bundleImage
                value: "$(tasks.get-unreleased-bundle.results.quayBundle)"

    # ── 5. Build Hypershift imageContentSources ────────────────────────
    # Fetch the operator's ImageDigestMirrorSet (Conforma convention), convert
    # to Hypershift imageContentSources, pass as a string into create-cluster.
    - name: build-image-content-sources
      runAfter:
        - pick-cluster-params
      when:
        - input: "$(tasks.get-unreleased-bundle.results.unreleasedBundle)"
          operator: notin
          values: [""]
      params:
        - name: fbcFragment
          value: "$(tasks.parse-metadata.results.component-container-image)"
        - name: testBundleRef
          value: $(params.TEST_BUNDLE_REF)
        - name: imagesMirrorSetRef
          value: $(params.IMAGES_MIRROR_SET_REF)
      taskSpec:
        params:
          - name: fbcFragment
            type: string
          - name: testBundleRef
            type: string
          - name: imagesMirrorSetRef
            type: string
        results:
          - name: imageContentSources
            description: Hypershift imageContentSources YAML (empty if none)
        steps:
          - name: build
            image: quay.io/konflux-ci/task-runner:1.5.0@sha256:200019314a50be5b6dd06f362c794c92a700583a522c5eee9a41e3eab7f706c5
            env:
              - name: FBC_FRAGMENT
                value: "$(params.fbcFragment)"
              - name: TEST_BUNDLE_REF
                value: "$(params.testBundleRef)"
              - name: IMAGES_MIRROR_SET_REF
                value: "$(params.imagesMirrorSetRef)"
            script: |
              #!/usr/bin/env bash
              set -euo pipefail

              # Use backticks for command substitution so Tekton does not mangle $$(...).
              ICS_OUT="/tmp/image-content-sources.yaml"
              : > "${ICS_OUT}"
              RESULT_PATH=$(results.imageContentSources.path)

              finish() {
                cat "${ICS_OUT}" > "${RESULT_PATH}"
              }
              trap finish EXIT

              # Released / non-Konflux FBC: nothing to mirror
              if [[ "${FBC_FRAGMENT}" != quay.io/redhat-user-workloads/* ]]; then
                echo "FBC is not on redhat-user-workloads; skipping imageContentSources"
                exit 0
              fi

              # Resolve mirror-set ref: explicit override, else same repo as TEST_BUNDLE_REF
              MIRROR_REF="${IMAGES_MIRROR_SET_REF}"
              if [[ -z "${MIRROR_REF}" ]]; then
                FULL_URL="${TEST_BUNDLE_REF%%#*}"
                if [[ "${FULL_URL}" == *".git@"* ]]; then
                  GIT_URL="${FULL_URL%@*}"
                  GIT_REF="${FULL_URL##*.git@}"
                else
                  # https://host/org/repo@branch (no .git before @)
                  case "${FULL_URL}" in
                    https://*@*)
                      GIT_REF="${FULL_URL##*@}"
                      GIT_URL="${FULL_URL%@*}"
                      ;;
                    *)
                      GIT_URL="${FULL_URL}"
                      GIT_REF="main"
                      ;;
                  esac
                fi
                MIRROR_REF="${GIT_URL%.git}.git@${GIT_REF}#.tekton/images-mirror-set.yaml"
                echo "Defaulting IMAGES_MIRROR_SET_REF from TEST_BUNDLE_REF: ${MIRROR_REF}"
              fi

              FULL_URL="${MIRROR_REF%%#*}"
              FILE_PATH="${MIRROR_REF#*#}"
              [[ "${FILE_PATH}" == "${MIRROR_REF}" ]] && FILE_PATH=".tekton/images-mirror-set.yaml"

              if [[ "${FULL_URL}" == *".git@"* ]]; then
                GIT_URL="${FULL_URL%@*}"
                GIT_REF="${FULL_URL##*.git@}"
              else
                case "${FULL_URL}" in
                  https://*@*)
                    GIT_REF="${FULL_URL##*@}"
                    GIT_URL="${FULL_URL%@*}"
                    ;;
                  *)
                    GIT_URL="${FULL_URL}"
                    GIT_REF="main"
                    ;;
                esac
              fi
              GIT_URL="${GIT_URL%.git}"

              echo "Fetching mirror set: ${GIT_URL}@${GIT_REF} path=${FILE_PATH}"

              IDMS_FILE="/tmp/images-mirror-set.yaml"
              case "${GIT_URL}" in
                *github.com/*/*)
                  ORG_REPO="${GIT_URL#*github.com/}"
                  ORG="${ORG_REPO%%/*}"
                  REPO="${ORG_REPO#*/}"
                  REPO="${REPO%%/*}"
                  RAW_URL="https://raw.githubusercontent.com/${ORG}/${REPO}/${GIT_REF}/${FILE_PATH}"
                  if ! curl -fsSL "${RAW_URL}" -o "${IDMS_FILE}"; then
                    echo "ERROR: Failed to fetch ${RAW_URL}" >&2
                    echo "Unreleased operators need .tekton/images-mirror-set.yaml in the monorepo" >&2
                    echo "(same file used by Conforma). Or set IMAGES_MIRROR_SET_REF explicitly." >&2
                    exit 1
                  fi
                  ;;
                *)
                  CLONE_DIR=`mktemp -d`
                  curl -fsSL "${GIT_URL}/archive/${GIT_REF}.tar.gz" | tar xz -C "${CLONE_DIR}" --strip-components=1
                  if [[ ! -f "${CLONE_DIR}/${FILE_PATH}" ]]; then
                    echo "ERROR: ${FILE_PATH} not found in ${GIT_URL}@${GIT_REF}" >&2
                    exit 1
                  fi
                  cp "${CLONE_DIR}/${FILE_PATH}" "${IDMS_FILE}"
                  rm -rf "${CLONE_DIR}"
                  ;;
              esac

              KIND=`yq -r 'select(.kind != null) | .kind' "${IDMS_FILE}" | head -1`
              if [[ "${KIND}" == "ImageDigestMirrorSet" ]]; then
                yq -o=yaml 'select(.kind == "ImageDigestMirrorSet") | .spec.imageDigestMirrors' \
                  "${IDMS_FILE}" > "${ICS_OUT}"
              elif yq -e '.[0].source' "${IDMS_FILE}" &>/dev/null; then
                cp "${IDMS_FILE}" "${ICS_OUT}"
              else
                echo "ERROR: ${FILE_PATH} is neither ImageDigestMirrorSet nor an imageContentSources list" >&2
                cat "${IDMS_FILE}" >&2
                exit 1
              fi

              ICS_LEN=`yq 'length' "${ICS_OUT}"`
              if [[ ! -s "${ICS_OUT}" ]] || [[ "${ICS_LEN}" == "0" ]]; then
                echo "ERROR: No mirrors found in ${FILE_PATH}" >&2
                exit 1
              fi

              echo "Built imageContentSources:"
              cat "${ICS_OUT}"

    # ── 6. Provision Ephemeral Cluster ─────────────────────────────────
    # Note: do not gate on ocpVersion/bundleArch results. Those StepAction
    # results sometimes do not surface on the TaskRun, which makes Tekton
    # treat them as "" and silently skip this task (PipelineRun still Succeeded).
    - name: provision-cluster
      runAfter:
        - build-image-content-sources
      when:
        - input: "$(tasks.get-unreleased-bundle.results.unreleasedBundle)"
          operator: notin
          values: [""]
      params:
        - name: imageContentSources
          value: "$(tasks.build-image-content-sources.results.imageContentSources)"
      taskSpec:
        params:
          - name: imageContentSources
            type: string
        results:
          - name: clusterName
            value: "$(steps.create-cluster.results.clusterName)"
        steps:
          - name: get-latest-version-tag
            ref:
              resolver: git
              params:
                - name: url
                  value: https://github.com/konflux-ci/build-definitions.git
                - name: revision
                  value: main
                - name: pathInRepo
                  value: stepactions/eaas-get-latest-openshift-version-by-prefix/0.1/eaas-get-latest-openshift-version-by-prefix.yaml
            params:
              - name: prefix
                value: "$(tasks.pick-cluster-params.results.ocpVersion)"

          - name: create-cluster
            ref:
              resolver: git
              params:
                - name: url
                  value: https://github.com/konflux-ci/build-definitions.git
                - name: revision
                  value: main
                - name: pathInRepo
                  value: stepactions/eaas-create-ephemeral-cluster-hypershift-aws/0.1/eaas-create-ephemeral-cluster-hypershift-aws.yaml
            params:
              - name: eaasSpaceSecretRef
                value: $(tasks.provision-eaas-space.results.secretRef)
              - name: version
                value: "$(steps.get-latest-version-tag.results.version)"
              - name: instanceType
                value: "$(tasks.pick-cluster-params.results.bundleArch)"
              - name: imageContentSources
                value: "$(params.imageContentSources)"

    # ── 7. Deploy Operator + Operands + Run Certsuite ──────────────────
    - name: deploy-and-test
      runAfter:
        - provision-cluster
      when:
        - input: "$(tasks.get-unreleased-bundle.results.unreleasedBundle)"
          operator: notin
          values: [""]
      params:
        - name: eaasSpaceSecretRef
          value: $(tasks.provision-eaas-space.results.secretRef)
        - name: clusterName
          value: "$(tasks.provision-cluster.results.clusterName)"
        - name: fbcFragment
          value: "$(tasks.parse-metadata.results.component-container-image)"
        - name: bundleImage
          value: "$(tasks.get-unreleased-bundle.results.unreleasedBundle)"
        - name: packageName
          value: "$(tasks.get-unreleased-bundle.results.packageName)"
        - name: channelName
          value: "$(tasks.get-unreleased-bundle.results.channelName)"
        - name: testBundleRef
          value: $(params.TEST_BUNDLE_REF)
        - name: certsuiteLabels
          value: $(params.CERTSUITE_LABELS)
        - name: ociPushSecret
          value: $(params.OCI_PUSH_SECRET)
        - name: ociResultsRepo
          value: $(params.OCI_RESULTS_REPO)
        - name: ociResultsSecret
          value: $(params.OCI_RESULTS_SECRET)
        - name: pipelineScriptsRef
          value: $(params.PIPELINE_SCRIPTS_REF)
      taskSpec:
        params:
          - name: eaasSpaceSecretRef
            type: string
          - name: clusterName
            type: string
          - name: fbcFragment
            type: string
          - name: bundleImage
            type: string
          - name: packageName
            type: string
          - name: channelName
            type: string
          - name: testBundleRef
            type: string
          - name: certsuiteLabels
            type: string
          - name: ociPushSecret
            type: string
          - name: ociResultsRepo
            type: string
          - name: ociResultsSecret
            type: string
          - name: pipelineScriptsRef
            type: string
        volumes:
          - name: credentials
            emptyDir: {}
          - name: oci-push-creds
            secret:
              secretName: $(params.ociPushSecret)
              optional: true
          - name: oci-results-creds
            secret:
              secretName: $(params.ociResultsSecret)
              optional: true
        steps:
          # ── Step 1: Get kubeconfig from EaaS ─────────────────────────
          - name: get-kubeconfig
            ref:
              resolver: git
              params:
                - name: url
                  value: https://github.com/konflux-ci/build-definitions.git
                - name: revision
                  value: main
                - name: pathInRepo
                  value: stepactions/eaas-get-ephemeral-cluster-credentials/0.1/eaas-get-ephemeral-cluster-credentials.yaml
            params:
              - name: eaasSpaceSecretRef
                value: $(params.eaasSpaceSecretRef)
              - name: clusterName
                value: $(params.clusterName)
              - name: credentials
                value: credentials

          # ── Step 2: Fetch test bundle ─────────────────────────────────
          - name: fetch-test-bundle
            image: quay.io/konflux-ci/konflux-test:v1.4.31@sha256:a7cae9e96663e277a3904d0c78630508ddb6cc8eebaa912a840bd20f68dcaad1
            env:
              - name: TEST_BUNDLE_REF
                value: "$(params.testBundleRef)"
              - name: PIPELINE_SCRIPTS_REF
                value: "$(params.pipelineScriptsRef)"
            script: |
              #!/usr/bin/env bash
              set -euo pipefail

              _parse_ref() {
                local ref="$1"
                GIT_PATH="${ref#*#}"; local url="${ref%%#*}"
                [[ "${GIT_PATH}" == "${ref}" ]] && GIT_PATH="."
                if [[ "${url}" == *".git@"* ]]; then
                  GIT_URL="${url%@*}"; GIT_REF="${url##*.git@}"
                elif [[ "${url}" =~ ^(https://[^@]+)@([^@]+)$ ]]; then
                  GIT_URL="${BASH_REMATCH[1]}"; GIT_REF="${BASH_REMATCH[2]}"
                else
                  GIT_URL="${url}"; GIT_REF="main"
                fi
                GIT_URL="${GIT_URL%.git}"
              }

              _download() {
                local tmp; tmp=$(mktemp -d)
                curl -sL "${GIT_URL}/archive/${GIT_REF}.tar.gz" | tar xz -C "${tmp}" --strip-components=1
                echo "${tmp}"
              }

              # Fetch test bundle
              _parse_ref "${TEST_BUNDLE_REF}"
              BUNDLE_DIR="/workspace/test-bundle"; mkdir -p "${BUNDLE_DIR}"
              echo "[$(date -u +%FT%T.%3NZ)] Downloading bundle from ${GIT_URL} ref=${GIT_REF} path=${GIT_PATH}"
              TMP=$(_download); cp -r "${TMP}/${GIT_PATH}/." "${BUNDLE_DIR}/"; rm -rf "${TMP}"

              if [[ ! -f "${BUNDLE_DIR}/certsuite-test-bundle.yaml" ]]; then
                echo "ERROR: certsuite-test-bundle.yaml not found in ${GIT_PATH}" >&2
                exit 1
              fi
              ls -la "${BUNDLE_DIR}/"

              # Fetch helper scripts
              _parse_ref "${PIPELINE_SCRIPTS_REF}"
              SCRIPTS_DIR="/workspace/scripts"; mkdir -p "${SCRIPTS_DIR}"
              echo "[$(date -u +%FT%T.%3NZ)] Fetching helper scripts from ${GIT_URL} ref=${GIT_REF}"
              TMP=$(_download)
              cp "${TMP}/scripts/resolve-bundle-config.sh" "${TMP}/scripts/wait-for-readiness.sh" "${SCRIPTS_DIR}/"
              chmod +x "${SCRIPTS_DIR}"/*.sh; rm -rf "${TMP}"
              echo "[$(date -u +%FT%T.%3NZ)] Helper scripts installed"

          # ── Step 3: Deploy operator via OLM ──────────────────────────
          - name: deploy-operator
            image: quay.io/konflux-ci/konflux-test:v1.4.31@sha256:a7cae9e96663e277a3904d0c78630508ddb6cc8eebaa912a840bd20f68dcaad1
            onError: continue
            computeResources:
              limits:
                memory: 4Gi
              requests:
                memory: 4Gi
                cpu: 500m
            volumeMounts:
              - name: credentials
                mountPath: /credentials
            env:
              - name: KUBECONFIG
                value: "/credentials/$(steps.get-kubeconfig.results.kubeconfig)"
              - name: FBC_FRAGMENT
                value: "$(params.fbcFragment)"
              - name: BUNDLE_IMAGE
                value: "$(params.bundleImage)"
              - name: PACKAGE_NAME
                value: "$(params.packageName)"
              - name: CHANNEL_NAME
                value: "$(params.channelName)"
              - name: TEST_BUNDLE_REF
                value: "$(params.testBundleRef)"
            script: |
              #!/usr/bin/env bash
              set -euo pipefail

              echo "[$(date -u +%FT%T.%3NZ)] Deploying operator: package=${PACKAGE_NAME} channel=${CHANNEL_NAME}"
              oc whoami || { echo "ERROR: Cannot connect to cluster"; exit 1; }

              # ── Wait for at least one worker node to be Ready ──────────────
              echo "[$(date -u +%FT%T.%3NZ)] Waiting for worker nodes..."
              for i in $(seq 1 90); do
                READY_NODES=$(oc get nodes --no-headers 2>/dev/null | grep -c ' Ready' || echo "0")
                if [[ "${READY_NODES}" -gt 0 ]]; then
                  echo "[$(date -u +%FT%T.%3NZ)] ${READY_NODES} node(s) Ready"
                  break
                fi
                [[ ${i} -eq 90 ]] && { echo "ERROR: No nodes became Ready within 450s"; exit 1; }
                sleep 5
              done

              # ── Verify Hypershift-managed IDMS (from imageContentSources) ───
              echo "[$(date -u +%FT%T.%3NZ)] Checking ImageDigestMirrorSet on guest cluster..."
              for i in $(seq 1 30); do
                IDMS_COUNT=$(oc get imagedigestmirrorset -o name 2>/dev/null | wc -l | tr -d ' ')
                if [[ "${IDMS_COUNT}" -gt 0 ]]; then
                  echo "[$(date -u +%FT%T.%3NZ)] Found ${IDMS_COUNT} ImageDigestMirrorSet(s):"
                  oc get imagedigestmirrorset -o yaml | jq -r '
                    .items[]? |
                    "  \(.metadata.name): " +
                    ([.spec.imageDigestMirrors[]? | "\(.source) -> \(.mirrors[0])"] | join("; "))
                  ' 2>/dev/null || oc get imagedigestmirrorset
                  break
                fi
                if [[ ${i} -eq 30 ]]; then
                  echo "[$(date -u +%FT%T.%3NZ)] WARNING: No IDMS found. Unreleased registry.redhat.io pulls may fail."
                  echo "  Ensure .tekton/images-mirror-set.yaml exists (or IMAGES_MIRROR_SET_REF) and ClusterTemplate supports imageContentSources."
                fi
                sleep 5
              done

              # ── Render FBC for package/bundle metadata (no image patching) ──
              echo "[$(date -u +%FT%T.%3NZ)] Rendering FBC fragment..."
              opm render "${FBC_FRAGMENT}" > /tmp/fbc.json

              BUNDLE_NAME=$(jq -r 'select(.schema == "olm.bundle") | .name' /tmp/fbc.json | head -1)
              echo "[$(date -u +%FT%T.%3NZ)] Bundle name: ${BUNDLE_NAME}"
              echo "[$(date -u +%FT%T.%3NZ)] Bundle image (via IDMS): $(jq -r 'select(.schema == "olm.bundle") | .image' /tmp/fbc.json | head -1)"
              echo "[$(date -u +%FT%T.%3NZ)] Unreleased bundle result: ${BUNDLE_IMAGE}"

              # ── Resolve install config from test bundle ─────────────────────
              CSV_SUGGESTED_NS=$(jq -r 'select(.schema == "olm.bundle") | .properties[]? |
                select(.type == "olm.csv.metadata") |
                .value.annotations["operatorframework.io/suggested-namespace"] // empty' \
                /tmp/fbc.json 2>/dev/null | grep -v '^$' | head -1) || CSV_SUGGESTED_NS=""

              CSV_INSTALL_MODES=$(jq -r 'select(.schema == "olm.bundle") | .properties[]? |
                select(.type == "olm.csv.metadata") |
                .value.installModes[]? | select(.supported == true) | .type' \
                /tmp/fbc.json 2>/dev/null | grep -v '^$') || CSV_INSTALL_MODES=""

              echo "[$(date -u +%FT%T.%3NZ)] CSV fallbacks: suggested-ns='${CSV_SUGGESTED_NS}' modes='$(echo ${CSV_INSTALL_MODES} | tr '\n' ',')'"

              export CSV_SUGGESTED_NS CSV_INSTALL_MODES
              BUNDLE_DIR="/workspace/test-bundle"
              source /workspace/scripts/resolve-bundle-config.sh

              INSTALL_NAMESPACE="${BUNDLE_NAMESPACE}"
              if [[ -z "${INSTALL_NAMESPACE}" ]]; then
                INSTALL_NAMESPACE=$(oc create -f - -o jsonpath='{.metadata.name}' <<NS_EOF
              apiVersion: v1
              kind: Namespace
              metadata:
                generateName: oo-
              NS_EOF
                )
              elif ! oc get namespace "${INSTALL_NAMESPACE}" &>/dev/null; then
                oc create namespace "${INSTALL_NAMESPACE}"
              fi

              echo "[$(date -u +%FT%T.%3NZ)] Namespace: ${INSTALL_NAMESPACE}"
              echo -n "${INSTALL_NAMESPACE}" > /workspace/install-namespace

              if [[ "${BUNDLE_INSTALL_MODE}" == "OwnNamespace" && -z "${OG_TARGET_NS}" ]]; then
                OG_TARGET_NS="${INSTALL_NAMESPACE}"
              fi

              # ── OperatorGroup (mode-aware) ──────────────────────────────────
              EXISTING_OG=$(oc -n "${INSTALL_NAMESPACE}" get operatorgroup -o jsonpath="{.items[*].metadata.name}" 2>/dev/null || true)
              if [[ -z "${EXISTING_OG}" ]]; then
                OG_SPEC=""
                if [[ -n "${OG_TARGET_NS}" ]]; then
                  OG_SPEC="targetNamespaces:
                    - ${OG_TARGET_NS}"
                fi
                oc create -f - <<OG_EOF
              apiVersion: operators.coreos.com/v1
              kind: OperatorGroup
              metadata:
                generateName: oo-
                namespace: ${INSTALL_NAMESPACE}
              spec:
                ${OG_SPEC}
              OG_EOF
              fi

              # ── CatalogSource from FBC fragment image (quay.io) ───────────────
              # Bundle/operator images still reference registry.redhat.io in the
              # catalog/CSV; Hypershift IDMS (from imageContentSources) redirects
              # those pulls to quay.io transparently.
              CATSRC=$(oc create -f - -o jsonpath='{.metadata.name}' <<CS_EOF
              apiVersion: operators.coreos.com/v1alpha1
              kind: CatalogSource
              metadata:
                generateName: oo-
                namespace: ${INSTALL_NAMESPACE}
              spec:
                sourceType: grpc
                image: ${FBC_FRAGMENT}
                displayName: "Certsuite Test Catalog"
                publisher: "konflux-certsuite"
              CS_EOF
              )

              echo "[$(date -u +%FT%T.%3NZ)] Waiting for CatalogSource ${CATSRC}..."
              for i in $(seq 1 60); do
                STATE=$(oc get catalogsource "${CATSRC}" -n "${INSTALL_NAMESPACE}" \
                  -o jsonpath='{.status.connectionState.lastObservedState}' 2>/dev/null || echo "")
                [[ "${STATE}" == "READY" ]] && break
                [[ ${i} -eq 60 ]] && {
                  echo "ERROR: CatalogSource not ready" >&2
                  oc get catalogsource "${CATSRC}" -n "${INSTALL_NAMESPACE}" -o yaml >&2
                  oc get pods -n "${INSTALL_NAMESPACE}" -o wide >&2 || true
                  exit 1
                }
                sleep 10
              done
              echo "[$(date -u +%FT%T.%3NZ)] CatalogSource ${CATSRC} READY"

              # ── Subscription (Automatic). IDMS handles image pulls.
              # Optional CSV patches come from the operator test bundle (if any).
              SUB=$(oc create -f - -o jsonpath='{.metadata.name}' <<SUB_EOF
              apiVersion: operators.coreos.com/v1alpha1
              kind: Subscription
              metadata:
                generateName: oo-
                namespace: ${INSTALL_NAMESPACE}
              spec:
                channel: ${CHANNEL_NAME}
                installPlanApproval: Automatic
                name: ${PACKAGE_NAME}
                source: ${CATSRC}
                sourceNamespace: ${INSTALL_NAMESPACE}
                startingCSV: ${BUNDLE_NAME}
              SUB_EOF
              )

              echo "[$(date -u +%FT%T.%3NZ)] Waiting for OLM to create CSV..."
              CSV=""
              for i in $(seq 1 60); do
                CSV=$(oc get subscription "${SUB}" -n "${INSTALL_NAMESPACE}" \
                  -o jsonpath='{.status.installedCSV}' 2>/dev/null || echo "")
                [[ -n "${CSV}" ]] && break
                # installedCSV may lag; the CSV often appears as startingCSV first
                if oc get csv "${BUNDLE_NAME}" -n "${INSTALL_NAMESPACE}" &>/dev/null; then
                  CSV="${BUNDLE_NAME}"
                  break
                fi
                sleep 5
              done
              if [[ -z "${CSV}" ]]; then
                echo "ERROR: OLM did not create CSV" >&2
                oc get subscription "${SUB}" -n "${INSTALL_NAMESPACE}" -o yaml >&2
                oc get installplan -n "${INSTALL_NAMESPACE}" -o yaml >&2 || true
                exit 1
              fi
              echo "[$(date -u +%FT%T.%3NZ)] CSV created: ${CSV}"

              # ── Optional CSV patches from the operator test bundle ──────────
              # No operator-specific CSV surgery in the pipeline. Owners supply
              # JSON6902 / strategic-merge patches via spec.csvPatches or
              # csv-patches/. Absent patches → no-op.
              BUNDLE_DIR="/workspace/test-bundle"
              if [[ ! -f "${BUNDLE_DIR}/certsuite-test-bundle.yaml" ]]; then
                mkdir -p "${BUNDLE_DIR}"
                FULL_URL="${TEST_BUNDLE_REF%%#*}"
                BUNDLE_PATH="${TEST_BUNDLE_REF#*#}"
                [[ "${BUNDLE_PATH}" == "${TEST_BUNDLE_REF}" ]] && BUNDLE_PATH="."

                if [[ "${FULL_URL}" == *".git@"* ]]; then
                  GIT_URL="${FULL_URL%@*}"
                  GIT_REF="${FULL_URL##*.git@}"
                elif [[ "${FULL_URL}" =~ ^(https://[^@]+)@([^@]+)$ ]]; then
                  GIT_URL="${BASH_REMATCH[1]}"
                  GIT_REF="${BASH_REMATCH[2]}"
                else
                  GIT_URL="${FULL_URL}"
                  GIT_REF="main"
                fi
                GIT_URL="${GIT_URL%.git}"

                echo "[$(date -u +%FT%T.%3NZ)] Fetching test bundle for CSV patches: ${GIT_URL}@${GIT_REF} (${BUNDLE_PATH})"
                CLONE_DIR=$(mktemp -d)
                curl -sL "${GIT_URL}/archive/${GIT_REF}.tar.gz" | tar xz -C "${CLONE_DIR}" --strip-components=1
                cp -r "${CLONE_DIR}/${BUNDLE_PATH}/." "${BUNDLE_DIR}/"
                rm -rf "${CLONE_DIR}"
              fi

              collect_csv_patches() {
                local manifest="${BUNDLE_DIR}/certsuite-test-bundle.yaml"
                if [[ -f "${manifest}" ]] && command -v yq &>/dev/null; then
                  local listed
                  listed=$(yq -r '.spec.csvPatches[]? | (.path // .) | select(. != null and . != "")' \
                    "${manifest}" 2>/dev/null || true)
                  if [[ -n "${listed}" ]]; then
                    while IFS= read -r rel; do
                      [[ -z "${rel}" || "${rel}" == "null" ]] && continue
                      echo "${BUNDLE_DIR}/${rel}"
                    done <<< "${listed}"
                    return
                  fi
                fi
                if [[ -d "${BUNDLE_DIR}/csv-patches" ]]; then
                  find "${BUNDLE_DIR}/csv-patches" \( -name '*.json' -o -name '*.yaml' -o -name '*.yml' \) -type f | sort
                fi
              }

              apply_json6902() {
                python3 - "$1" "$2" <<'PY'
              import json, sys

              def unescape(token: str) -> str:
                  return token.replace("~1", "/").replace("~0", "~")

              def parent_and_key(doc, path: str):
                  parts = [unescape(p) for p in path.lstrip("/").split("/")]
                  cur = doc
                  for part in parts[:-1]:
                      cur = cur[int(part)] if isinstance(cur, list) else cur[part]
                  return cur, parts[-1]

              def apply_ops(doc, ops):
                  for op in ops:
                      kind, path = op["op"], op["path"]
                      if kind == "remove":
                          try:
                              parent, key = parent_and_key(doc, path)
                              if isinstance(parent, list):
                                  idx = int(key)
                                  if 0 <= idx < len(parent):
                                      parent.pop(idx)
                              elif isinstance(parent, dict) and key in parent:
                                  del parent[key]
                          except (KeyError, IndexError, TypeError, ValueError):
                              pass
                      elif kind in ("add", "replace"):
                          parent, key = parent_and_key(doc, path)
                          value = op["value"]
                          if isinstance(parent, list):
                              if kind == "add" and key == "-":
                                  parent.append(value)
                              elif kind == "add":
                                  parent.insert(int(key), value)
                              else:
                                  parent[int(key)] = value
                          else:
                              parent[key] = value
                      else:
                          raise SystemExit(f"unsupported JSON6902 op: {kind}")
                  return doc

              csv_path, ops_path = sys.argv[1], sys.argv[2]
              with open(csv_path) as fh:
                  doc = json.load(fh)
              with open(ops_path) as fh:
                  ops = json.load(fh)
              with open(csv_path, "w") as fh:
                  json.dump(apply_ops(doc, ops), fh)
              PY
              }

              mapfile -t CSV_PATCHES < <(collect_csv_patches)
              if [[ ${#CSV_PATCHES[@]} -eq 0 ]]; then
                echo "[$(date -u +%FT%T.%3NZ)] No CSV patches in test bundle (no-op)"
              else
                echo "[$(date -u +%FT%T.%3NZ)] Applying ${#CSV_PATCHES[@]} CSV patch(es) from test bundle"
                TMP_CSV=$(mktemp)
                TMP_OUT=$(mktemp)
                TMP_OPS=$(mktemp)
                oc get csv "${CSV}" -n "${INSTALL_NAMESPACE}" -o json > "${TMP_CSV}"
                for PATCH in "${CSV_PATCHES[@]}"; do
                  [[ -f "${PATCH}" ]] || { echo "ERROR: CSV patch not found: ${PATCH}" >&2; exit 1; }
                  echo "  Applying: ${PATCH#"${BUNDLE_DIR}"/}"
                  if [[ "${PATCH}" == *.json ]]; then
                    cp "${PATCH}" "${TMP_OPS}"
                    apply_json6902 "${TMP_CSV}" "${TMP_OPS}"
                  elif command -v yq &>/dev/null && \
                       yq -o=json '.' "${PATCH}" > "${TMP_OPS}" 2>/dev/null && \
                       python3 -c 'import json,sys; assert isinstance(json.load(open(sys.argv[1])), list)' "${TMP_OPS}" 2>/dev/null; then
                    apply_json6902 "${TMP_CSV}" "${TMP_OPS}"
                  else
                    oc patch --local -f "${TMP_CSV}" --type=strategic --patch-file="${PATCH}" -o json > "${TMP_OUT}"
                    mv "${TMP_OUT}" "${TMP_CSV}"
                    TMP_OUT=$(mktemp)
                  fi
                done
                oc replace -f "${TMP_CSV}"
                rm -f "${TMP_CSV}" "${TMP_OUT}" "${TMP_OPS}"
                echo "[$(date -u +%FT%T.%3NZ)] CSV patches applied"
              fi

              echo "[$(date -u +%FT%T.%3NZ)] Waiting for CSV phase=Succeeded..."
              for i in $(seq 1 120); do
                PHASE=$(oc get csv "${CSV}" -n "${INSTALL_NAMESPACE}" \
                  -o jsonpath='{.status.phase}' 2>/dev/null || echo "")
                if [[ "${PHASE}" == "Succeeded" ]]; then
                  echo "[$(date -u +%FT%T.%3NZ)] CSV '${CSV}' ready"

                  oc patch subscription "${SUB}" -n "${INSTALL_NAMESPACE}" \
                    --type merge --subresource status \
                    -p "{\"status\":{\"installedCSV\":\"${CSV}\"}}" 2>&1 || true

                  # Apply discovery labels from bundle config
                  LABEL_KEY="${DISCOVERY_OPERATOR_LABEL%%=*}"
                  LABEL_VAL="${DISCOVERY_OPERATOR_LABEL#*=}"
                  oc label csv "${CSV}" -n "${INSTALL_NAMESPACE}" \
                    "${LABEL_KEY}=${LABEL_VAL}" --overwrite 2>&1

                  POD_LABEL_KEY="${DISCOVERY_POD_LABEL%%=*}"
                  POD_LABEL_VAL="${DISCOVERY_POD_LABEL#*=}"
                  for RESOURCE_KIND in ${DISCOVERY_RESOURCE_KINDS}; do
                    LOWER_KIND=$(echo "${RESOURCE_KIND}" | tr '[:upper:]' '[:lower:]')
                    NAMES=$(oc get "${LOWER_KIND}" -n "${INSTALL_NAMESPACE}" \
                      -o jsonpath='{.items[*].metadata.name}' 2>/dev/null || echo "")
                    for RNAME in ${NAMES}; do
                      echo "[$(date -u +%FT%T.%3NZ)] Patching ${RESOURCE_KIND} ${RNAME} with discovery label..."
                      oc patch "${LOWER_KIND}" "${RNAME}" -n "${INSTALL_NAMESPACE}" --type=merge \
                        -p "{\"spec\":{\"template\":{\"metadata\":{\"labels\":{\"${POD_LABEL_KEY}\":\"${POD_LABEL_VAL}\"}}}}}" 2>&1
                      oc rollout status "${LOWER_KIND}/${RNAME}" -n "${INSTALL_NAMESPACE}" --timeout=120s 2>&1 || true
                    done
                  done

                  exit 0
                elif [[ "${PHASE}" == "Failed" ]]; then
                  echo "ERROR: CSV failed" >&2
                  oc get csv "${CSV}" -n "${INSTALL_NAMESPACE}" -o jsonpath='{.status.message}' >&2
                  oc get events -n "${INSTALL_NAMESPACE}" --sort-by='.lastTimestamp' | tail -30 >&2 || true
                  exit 1
                fi
                sleep 10
              done

              echo "ERROR: Timed out waiting for CSV (phase=${PHASE})" >&2
              oc get csv "${CSV}" -n "${INSTALL_NAMESPACE}" -o yaml >&2 || true
              oc get pods -n "${INSTALL_NAMESPACE}" -o wide >&2 || true
              oc get events -n "${INSTALL_NAMESPACE}" --sort-by='.lastTimestamp' | tail -40 >&2 || true
              exit 1

          # ── Step 4: Deploy operands from test bundle ─────────────────
          - name: deploy-operands
            image: quay.io/konflux-ci/konflux-test:v1.4.31@sha256:a7cae9e96663e277a3904d0c78630508ddb6cc8eebaa912a840bd20f68dcaad1
            volumeMounts:
              - name: credentials
                mountPath: /credentials
            env:
              - name: KUBECONFIG
                value: "/credentials/$(steps.get-kubeconfig.results.kubeconfig)"
            script: |
              #!/usr/bin/env bash
              set -euo pipefail

              BUNDLE_DIR="/workspace/test-bundle"
              INSTALL_NAMESPACE=""
              [[ -f /workspace/install-namespace ]] && INSTALL_NAMESPACE=$(cat /workspace/install-namespace)

              source /workspace/scripts/resolve-bundle-config.sh
              TARGET_NS="${INSTALL_NAMESPACE}"

              echo "[$(date -u +%FT%T.%3NZ)] Deploying operands to: ${TARGET_NS}"

              # Apply prerequisites
              if [[ -d "${BUNDLE_DIR}/prerequisites" ]]; then
                oc apply -n "${TARGET_NS}" -f "${BUNDLE_DIR}/prerequisites/" 2>/dev/null || true
              fi

              # Apply operands
              if [[ -d "${BUNDLE_DIR}/operands" ]]; then
                oc apply -n "${TARGET_NS}" -f "${BUNDLE_DIR}/operands/"
              fi

              # Readiness checks from bundle (same logic as shared-cluster path)
              source /workspace/scripts/wait-for-readiness.sh

              echo "[$(date -u +%FT%T.%3NZ)] Operand deployment complete"

          # ── Step 5: Run certsuite ────────────────────────────────────
          - name: run-certsuite
            image: quay.io/redhat-best-practices-for-k8s/certsuite:latest
            onError: continue
            computeResources:
              limits:
                memory: 4Gi
              requests:
                memory: 2Gi
                cpu: 500m
            volumeMounts:
              - name: credentials
                mountPath: /credentials
            env:
              - name: KUBECONFIG
                value: "/credentials/$(steps.get-kubeconfig.results.kubeconfig)"
              - name: CERTSUITE_LABELS
                value: "$(params.certsuiteLabels)"
            script: |
              #!/usr/bin/env bash
              set -euo pipefail

              # Disable in-cluster config so client-go uses the EaaS kubeconfig
              # instead of the Tekton pod's SA token
              unset KUBERNETES_SERVICE_HOST KUBERNETES_SERVICE_PORT
              mkdir -p ~/.kube
              cp "${KUBECONFIG}" ~/.kube/config

              RESULTS_DIR="/workspace/results"
              CONFIG_FILE="/workspace/test-bundle/certsuite_config.yml"
              mkdir -p "${RESULTS_DIR}"

              if [[ ! -f "${CONFIG_FILE}" ]]; then
                echo "ERROR: certsuite_config.yml not found in test bundle" >&2
                exit 1
              fi

              mkdir -p config
              cp "${CONFIG_FILE}" config/certsuite_config.yml

              echo "[$(date -u +%FT%T.%3NZ)] KUBECONFIG=${KUBECONFIG}"

              IFS=',' read -ra LABELS <<< "${CERTSUITE_LABELS}"
              for LABEL in "${LABELS[@]}"; do
                LABEL=$(echo "${LABEL}" | xargs)
                SUITE_DIR="${RESULTS_DIR}/${LABEL}"
                mkdir -p "${SUITE_DIR}"

                echo "[$(date -u +%FT%T.%3NZ)] Running: ${LABEL}"
                set +e
                certsuite run \
                  --kubeconfig "${KUBECONFIG}" \
                  --config-file config/certsuite_config.yml \
                  --label-filter "${LABEL}" \
                  --output-dir "${SUITE_DIR}" \
                  2>&1 | tee "${SUITE_DIR}/certsuite.log"
                set -e
              done

              # Print summary
              for CLAIM in "${RESULTS_DIR}"/*/claim.json; do
                [[ -f "${CLAIM}" ]] || continue
                SUITE=$(basename "$(dirname "${CLAIM}")")
                TOTAL=$(jq '.claim.results | length' "${CLAIM}" 2>/dev/null || echo "?")
                PASSED=$(jq '[.claim.results[] | select(.state == "passed")] | length' "${CLAIM}" 2>/dev/null || echo "?")
                FAILED=$(jq '[.claim.results[] | select(.state == "failed")] | length' "${CLAIM}" 2>/dev/null || echo "?")
                echo "[$(date -u +%FT%T.%3NZ)] ${SUITE}: total=${TOTAL} passed=${PASSED} failed=${FAILED}"
              done

          # ── Step 5: Push results to OCI registry ────────────────────
          # Supports two modes:
          #   1. Component repo (default): push to the same Quay repo as
          #      the FBC image, authenticated via OCI_PUSH_SECRET.
          #   2. External repo: push to OCI_RESULTS_REPO, authenticated
          #      via OCI_RESULTS_SECRET. Credentials are never mixed
          #      between modes.
          - name: push-results
            image: ghcr.io/oras-project/oras:v1.2.2
            onError: continue
            volumeMounts:
              - name: oci-push-creds
                mountPath: /oci-push-creds
                readOnly: true
              - name: oci-results-creds
                mountPath: /oci-results-creds
                readOnly: true
            env:
              - name: FBC_FRAGMENT
                value: "$(params.fbcFragment)"
              - name: PACKAGE_NAME
                value: "$(params.packageName)"
              - name: OCI_RESULTS_REPO
                value: "$(params.ociResultsRepo)"
            script: |
              #!/bin/sh
              set -eu

              RESULTS_DIR="/workspace/results"
              if [ ! -d "${RESULTS_DIR}" ] || ! ls "${RESULTS_DIR}"/*/claim.json >/dev/null 2>&1; then
                echo "No certsuite results found. Skipping OCI push."
                exit 0
              fi

              # ── Determine target repo and credentials ──────────────────
              USE_EXTERNAL="false"
              if [ -n "${OCI_RESULTS_REPO}" ]; then
                USE_EXTERNAL="true"

                # Validate: reject tags and digests but allow host:port.
                # Split off the host (everything before the first /) and
                # check only the repo path for illegal : or @ characters.
                REPO_PATH="${OCI_RESULTS_REPO#*/}"
                case "${REPO_PATH}" in
                  *:*|*@*)
                    echo "ERROR: OCI_RESULTS_REPO must be a bare repository reference"
                    echo "       (no ':tag' or '@sha256:...'). Got: ${OCI_RESULTS_REPO}"
                    exit 1
                    ;;
                esac

                # External mode — require dedicated credentials (no fallback)
                DOCKER_CFG="/oci-results-creds/.dockerconfigjson"
                if [ ! -f "${DOCKER_CFG}" ]; then
                  echo "ERROR: OCI_RESULTS_REPO is set but OCI_RESULTS_SECRET is missing or empty."
                  echo "       External OCI storage requires its own push secret."
                  exit 1
                fi
                IMAGE_REF="${OCI_RESULTS_REPO}"
                echo "Using external OCI results repo: ${IMAGE_REF}"
              else
                # Component repo mode — derive from FBC fragment
                IMAGE_REF=$(echo "${FBC_FRAGMENT}" | cut -d'@' -f1)
                if [ -z "${IMAGE_REF}" ]; then
                  echo "Cannot derive OCI ref from FBC_FRAGMENT. Skipping."
                  exit 0
                fi
                DOCKER_CFG="/oci-push-creds/.dockerconfigjson"
                if [ ! -f "${DOCKER_CFG}" ]; then
                  echo "WARNING: OCI push secret not mounted at ${DOCKER_CFG}."
                  echo "Set OCI_PUSH_SECRET to the component ImageRepository push secret."
                  exit 0
                fi
              fi

              mkdir -p /tmp/docker
              cp "${DOCKER_CFG}" /tmp/docker/config.json
              export DOCKER_CONFIG=/tmp/docker

              # ── Build tag ──────────────────────────────────────────────
              # External repos are shared across operators, so include the
              # package name in the tag to avoid collisions. Component repo
              # tags keep the original format for backward compatibility.
              if [ "${USE_EXTERNAL}" = "true" ] && [ -n "${PACKAGE_NAME}" ]; then
                OCI_TAG="certsuite-results-${PACKAGE_NAME}-$(date -u +%Y%m%d-%H%M%S)"
              else
                OCI_TAG="certsuite-results-$(date -u +%Y%m%d-%H%M%S)"
              fi
              OCI_REF="${IMAGE_REF}:${OCI_TAG}"

              echo "Packaging results..."
              tar czf /tmp/certsuite-results.tar.gz -C /workspace results/

              echo "Pushing results to: ${OCI_REF}"
              cd /tmp
              if oras push "${OCI_REF}" \
                --artifact-type application/vnd.certsuite.results.v1+gzip \
                certsuite-results.tar.gz:application/gzip; then
                echo "Results pushed successfully"
                echo ""
                echo "Download results with:"
                echo "  oras pull ${OCI_REF}"
                echo "  tar xzf certsuite-results.tar.gz"
              else
                # Non-fatal: match existing OCI push policy (onError: continue).
                echo "ERROR: OCI push failed (non-fatal; pipeline continues)"
                echo "       Target: ${OCI_REF}"
                if [ "${USE_EXTERNAL}" = "true" ]; then
                  echo "       Check OCI_RESULTS_SECRET has push access to ${IMAGE_REF}."
                else
                  echo "       Check OCI_PUSH_SECRET has push access to ${IMAGE_REF}."
                fi
                exit 1
              fi

    # Results are pushed to either:
    #   a) the same Quay repo as the FBC/component image (OCI_PUSH_SECRET),
    #      tagged certsuite-results-<timestamp>, or
    #   b) an external repo (OCI_RESULTS_REPO + OCI_RESULTS_SECRET),
    #      tagged certsuite-results-<package>-<timestamp>.
    # Download with: oras pull <OCI_REF printed in push-results logs>
